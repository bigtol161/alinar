<header class="site-header">
    <div class="container">
        <nav>
            <a href="/" class="logo">Дом Услуг</a>
            <a href="{% url 'news:article_list' %}">Статьи</a>
            <a href="{% url 'news:executor_list' %}">Исполнители</a>
            {% if user.is_authenticated %}
                <a href="{% url 'news:my_leads' %}">Мои заявки</a>
                {% if user.executor %}
                    <a href="{% url 'news:executor_leads' %}">Заявки на анкету</a>
                {% endif %}
                <a href="{% url 'news:logout' %}">Выйти ({{ user.username }})</a>
            {% else %}
                <a href="{% url 'login' %}">Войти</a>
                <a href="{% url 'news:register' %}">Регистрация</a>
            {% endif %}
        </nav>
    </div>
</header>
