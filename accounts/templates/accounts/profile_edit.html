{% extends "base.html" %}

{% block title %}Редактирование профиля — Дом услуг{% endblock %}

{% block content %}

<h1 class="mb-3" style="font-size: 1.6rem; font-weight: 800;">Редактирование профиля</h1>

<div class="ya-card"><div class="card-body p-4">
  <form method="post" novalidate enctype="multipart/form-data">
    {% csrf_token %}
    {% for field in form %}
      <div class="mb-3">
        <label class="form-label" for="{{ field.id_for_label }}">{{ field.label }}</label>
        {{ field }}
        {% for error in field.errors %}<div class="text-danger small">{{ error }}</div>{% endfor %}
      </div>
    {% endfor %}
    <button type="submit" class="btn ya-btn">Сохранить</button>
    <a href="{% url 'profile' %}" class="btn btn-link text-decoration-none">Отмена</a>
  </form>
</div></div>

{% endblock %}
